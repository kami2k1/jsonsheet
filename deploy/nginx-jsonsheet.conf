# JSONSheet — nginx server block (additive; does not touch existing sites)
# Managed by deploy script. Serves the static build from /var/www/jsonsheet/current.

server {
    listen 80;
    listen [::]:80;
    server_name jsonsheet.com www.jsonsheet.com;
    access_log /var/log/nginx/jsonsheet.access.log;

    root /var/www/jsonsheet/current;
    index index.html;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    # Hashed assets are immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# TLS terminated here for Cloudflare "Full (strict)" mode.
# Let's Encrypt cert via certbot webroot (renews automatically; deploy hook reloads nginx).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jsonsheet.com www.jsonsheet.com;

    ssl_certificate     /etc/letsencrypt/live/jsonsheet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsonsheet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/jsonsheet.access.log;

    root /var/www/jsonsheet/current;
    index index.html;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
